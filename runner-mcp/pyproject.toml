[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runner-mcp"
version = "0.1.0"
description = "stdio MCP server exposing run_command and list_targets for code-review-graph"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runner_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
